# Limits enforced by the track_drive_controller node (before diff_drive_controller).
track_drive_controller:
  ros__parameters:
    control_rate: 50.0              # Hz
    max_linear_velocity: 0.8        # m/s
    max_angular_velocity: 1.5       # rad/s
    max_linear_accel: 1.0           # m/s^2
    max_angular_accel: 3.0          # rad/s^2
    teleop_timeout: 0.5             # s - manual command considered stale after this
    nav_timeout: 0.5                # s - autonomous command considered stale after this
    angular_gain: 1.0               # slip compensation on yaw rate
    output_topic: diff_drive_controller/cmd_vel
    frame_id: base_footprint
    relay_odom: true
